name: Windows preview

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/windows-preview.yml'

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      PYTHONUTF8: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-front-rust-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-front-rust-
      - name: Verify desktop version, tag and internal-only build policy
        run: python desktop/artifact_integrity.py --source-check
      - name: Install build dependencies
        run: |
          python -m pip install -e "backend[dev]" -r desktop/requirements-build.txt
          npm --prefix frontend ci
          npm --prefix desktop ci
      - name: Test backend
        timeout-minutes: 15
        run: python -m pytest backend/tests -q
      - name: Build shared frontend
        run: |
          npm --prefix frontend test
          npm --prefix frontend run build
      - name: Build frozen Python sidecar
        run: python desktop/build_sidecar.py
      - name: Test frozen sidecar in isolated directory
        timeout-minutes: 5
        run: python desktop/smoke_sidecar.py .cache/desktop-stage/backend/front-backend.exe .cache/desktop-smoke
      - name: Frozen startup and migration regression (minimal PATH, generated data)
        timeout-minutes: 8
        run: python desktop/regression_sidecar.py .cache/desktop-stage/backend/front-backend.exe .cache/desktop-regression
      - name: Collect license inventory
        shell: pwsh
        run: |
          python desktop/license_inventory.py
      - name: Official updater signature, signed-version and local HTTPS regression (no install)
        timeout-minutes: 20
        run: |
          python -m venv .cache/update-test-runtime
          .cache/update-test-runtime/Scripts/python.exe -m pip install -r desktop/requirements-update-test.txt
          .cache/update-test-runtime/Scripts/python.exe desktop/test_updater.py .cache/updater-generated-tests
      - name: Build Tauri x64 NSIS installer
        working-directory: desktop
        run: npm run build -- --ci -- --locked
      - name: Package portable preview and hashes
        run: python desktop/package_portable.py
      - name: Independently verify packaged files, CRC, hashes and manifest
        run: python desktop/artifact_integrity.py .cache/desktop-stage/artifacts
      - name: Upload verified preview build
        uses: actions/upload-artifact@v4
        with:
          name: Front-windows-x64-preview
          path: .cache/desktop-stage/artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve dependency lock diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Front-build-lock-diagnostics
          path: desktop/src-tauri/Cargo.lock
          if-no-files-found: ignore
          retention-days: 7
