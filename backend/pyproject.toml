[project]
name = "front-api"
version = "0.6.4"
description = "Front 创作素材库与百科数据库 · 后端 API"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "pydantic>=2.5",
  "python-multipart>=0.0.9",
  "pillow>=10.0",
  "httpx>=0.27",
  "tinytag>=2.0",      # 音频标签（MIT）
  "pypdfium2>=4.20",   # PDF 页数 / 文字 / 页面渲染（Apache-2.0 或 BSD-3）
]

[project.optional-dependencies]
dev = ["pytest>=8", "tomli>=2.0.1; python_version < '3.11'"]

[project.scripts]
front-api = "front_api.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["front_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
