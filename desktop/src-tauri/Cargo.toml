[package]
name = "front-desktop"
version = "0.7.0-preview.1"
description = "Front local creative library"
authors = ["Front contributors"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = {version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging"]}

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
